name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Lint (basic)
        run: python -m py_compile logagg/server.py logagg/engine.py logagg/index.py logagg/models.py logagg/query.py logagg/wal.py logagg/tokenizer.py logagg/agent.py

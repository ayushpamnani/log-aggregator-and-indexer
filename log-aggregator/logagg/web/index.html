<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>logagg search</title>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --text:#1c2230; --muted:#667085; --line:#dfe3ea; --accent:#2457d6;
          --debug:#667085; --info:#1d7a4d; --warn:#a15c00; --error:#c0332b; --fatal:#7a1fa2; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171d; --panel:#1c212b; --text:#e6e9ef; --muted:#98a2b3; --line:#2c3341; --accent:#7aa2ff;
            --debug:#98a2b3; --info:#5fcf97; --warn:#f0b34a; --error:#ff7b72; --fatal:#d49bff; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, sans-serif; }
  header { padding:14px 20px; background:var(--panel); border-bottom:1px solid var(--line); display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  h1 { font-size:17px; margin:0 12px 0 0; }
  input, select, button { font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:7px 10px; }
  input[type=search] { flex:1 1 320px; min-width:200px; }
  button { background:var(--accent); color:#fff; border-color:var(--accent); cursor:pointer; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  main { display:grid; grid-template-columns:230px 1fr; gap:16px; padding:16px 20px; }
  @media (max-width:760px) { main { grid-template-columns:1fr; } }
  aside, .results { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px 14px; }
  aside h2 { font-size:14px; margin:0 0 6px; }
  aside ul { list-style:none; margin:0 0 14px; padding:0; }
  aside li { display:flex; justify-content:space-between; padding:2px 0; cursor:pointer; }
  aside li:hover { color:var(--accent); }
  .meta { color:var(--muted); font-size:13px; margin-bottom:8px; }
  .results { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; }
  td { padding:5px 8px; border-top:1px solid var(--line); vertical-align:top; }
  td.t { white-space:nowrap; color:var(--muted); font-size:13px; }
  td.m { font-family:ui-monospace, Menlo, Consolas, monospace; font-size:13px; word-break:break-word; }
  .lv { font-weight:600; }
  .DEBUG{color:var(--debug)} .INFO{color:var(--info)} .WARN{color:var(--warn)} .ERROR{color:var(--error)} .FATAL{color:var(--fatal)}
  .empty { color:var(--muted); padding:20px 4px; }
</style>
</head>
<body>
<header>
  <h1>logagg</h1>
  <input id="q" type="search" placeholder='Search logs, e.g.  timeout level:error service:payment-service' aria-label="Search query">
  <select id="range" aria-label="Time range">
    <option value="900">Last 15 min</option><option value="3600" selected>Last hour</option>
    <option value="86400">Last 24 hours</option><option value="0">All time</option>
  </select>
  <select id="sort" aria-label="Sort"><option value="time">Newest first</option><option value="relevance">Most relevant</option></select>
  <button id="go">Search logs</button>
</header>
<main>
  <aside>
    <h2>Levels</h2><ul id="f-level"></ul>
    <h2>Services</h2><ul id="f-service"></ul>
    <h2>Index</h2><div class="meta" id="stats">loading…</div>
  </aside>
  <section class="results">
    <div class="meta" id="summary"></div>
    <table><tbody id="rows"></tbody></table>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function addFilter(field, value) {
  const q = $('q'); q.value = (q.value.trim() + ` ${field}:${value}`).trim(); run();
}
function facet(el, field, data) {
  el.innerHTML = Object.entries(data).map(([k, n]) =>
    `<li data-f="${field}" data-v="${esc(k)}"><span>${esc(k)}</span><span>${n}</span></li>`).join('') || '<li class="meta">none</li>';
}
async function run() {
  const range = +$('range').value, p = new URLSearchParams({ q: $('q').value, sort: $('sort').value, limit: 100 });
  if (range) p.set('from', Date.now() / 1000 - range);
  const r = await fetch('/search?' + p), d = await r.json();
  if (!r.ok) { $('summary').textContent = d.error; return; }
  $('summary').textContent = `${d.total.toLocaleString()} matches in ${d.took_ms} ms · searched ${d.segments_searched} segment(s), skipped ${d.segments_skipped}`;
  facet($('f-level'), 'level', d.facets.level); facet($('f-service'), 'service', d.facets.service);
  $('rows').innerHTML = d.results.length ? d.results.map(e =>
    `<tr><td class="t">${e.time.replace('T',' ').slice(0,23)}</td><td class="lv ${e.level}">${e.level}</td>
     <td>${esc(e.service)}</td><td class="m">${esc(e.message)}</td></tr>`).join('')
    : '<tr><td class="empty">No logs match. Widen the time range or start the agent: python -m logagg.agent --generate</td></tr>';
}
async function stats() {
  const s = await (await fetch('/stats')).json();
  $('stats').textContent = `${s.documents.total_indexed.toLocaleString()} docs · ${s.segments.length} segments · queue ${s.queue_depth}/${s.queue_capacity}`;
}
document.querySelectorAll('aside ul').forEach(u => u.addEventListener('click', e => {
  const li = e.target.closest('li[data-f]'); if (li) addFilter(li.dataset.f, li.dataset.v);
}));
$('go').onclick = run; $('q').addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
$('range').onchange = $('sort').onchange = run;
run(); stats(); setInterval(stats, 3000);
</script>
</body>
</html>
